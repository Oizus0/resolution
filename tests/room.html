<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificação da sala simulada</title><style>body{font:14px system-ui;background:#141a20;color:#dce8e1;margin:24px}button{padding:12px;border:0;border-radius:8px;background:#afe8c8;font-weight:600}li{padding:7px;line-height:1.6}.ok{color:#afe8c8}.fail{color:#f6a29c}iframe{width:0;height:0;border:0;position:absolute}p{color:#a7b6c2;max-width:700px;line-height:1.7}</style><style>body.visual{margin:0;min-height:100vh;padding:20px;box-sizing:border-box;background:#11161c;display:flex;flex-direction:column;align-items:center}body.visual>h1{font-size:16px;margin:0 0 5px}body.visual>p{font-size:12px;text-align:center;margin:0 0 12px}body.visual #results{display:none}body.visual>button{font-size:11px;padding:6px 10px;margin:3px}body.visual.has-panel>button{display:none}</style></head><body><h1>Verificação da comunicação</h1><p>Executa o SDK real em duas instâncias de segundo plano com uma sala simulada. Não acessa contas, mapas nem dados do Owlbear.</p><button id="run">Executar testes de integração</button><button id="panel" disabled>Abrir painel de teste</button><ol id="results"></ol><script type="module" src="./room.ts"></script><script>if(new URLSearchParams(location.search).has('visual')){document.body.classList.add('visual');document.querySelector('h1').textContent='Prévia do fundo transparente';document.querySelector('p').textContent='Fundo colorido ilustrativo para enxergar a transparência. Não é uma sala real do Owlbear.';new MutationObserver(()=>{if(document.querySelector('iframe[title]'))document.body.classList.add('has-panel');}).observe(document.body,{childList:true});}</script></body></html>
